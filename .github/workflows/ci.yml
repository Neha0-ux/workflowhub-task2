name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an older run when a newer commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - test and build Docker image
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-secret-key' }}
      DJANGO_DEBUG: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (pip)
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

      - uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: workflowhub-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test backend container
        working-directory: .
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            workflowhub-backend:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/api/health/ && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  frontend:
    name: Frontend - build Docker image
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: workflowhub-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
