services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-change-me}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the host-facing URL
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
